
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova solicitação</title>
</head>
<body>
    <main>
        <h1>Nova solicitação</h1>

        <form>
            <label for="titulo">Título</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                minlength="3"
                maxlength="100"
                required
            >

            <label for="descricao">Descrição</label>
            <textarea
                id="descricao"
                name="descricao"
                minlength="10"
                maxlength="1000"
                required
            ></textarea>

            <button type="submit">
                Salvar solicitação
            </button>
        </form>
    </main>
</body>
</html>
